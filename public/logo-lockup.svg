<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 232 56" width="232" height="56" role="img" aria-label="collab5">
  <g fill="none" stroke="#111111" stroke-width="2">
    <ellipse cx="28" cy="28" rx="20" ry="7" transform="rotate(30 28 28)"/>
    <ellipse cx="28" cy="28" rx="20" ry="7" transform="rotate(-30 28 28)"/>
  </g>
  <circle cx="45.32" cy="38" r="2.8" fill="#111111"/>
  <circle cx="10.68" cy="18" r="2.8" fill="#111111"/>
  <circle cx="45.32" cy="18" r="2.8" fill="#111111"/>
  <circle cx="28" cy="28" r="7" fill="#98FF5C" stroke="#111111" stroke-width="2.5"/>
  <!-- 워드마크 — 심볼 대비 작아 보인다는 대표 지적(08-14)으로 34→40.
       ⚠️viewBox 폭(232)은 그대로 둔다. SVG 루트는 기본이 overflow:hidden이라 viewBox를 넘긴
         글자는 잘린다 — 폰트 폴백(Pretendard 없는 기기)에서 더 넓게 잡힐 여지를 남겨둔 것.
         viewBox를 안 건드렸으므로 헤더에서 차지하는 실제 폭(h-6 기준 99px)도 그대로다. -->
  <text x="72" y="39.5" font-family="Pretendard, -apple-system, system-ui, sans-serif" font-weight="700" font-size="40" letter-spacing="-1.2" fill="#111111">collab5</text>
</svg>

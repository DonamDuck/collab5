<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="collab5">
<!-- collab5 파비콘(SVG) — 2026-08-16 새 마크. 정본 생성기 = assets/build-logo.py.
     ⚠️락업/마크와 **비례가 일부러 다르다**: 탭에서 16~32px로 줄어들면 획이 뭉개져서
        광학 보정(정사각을 0.86까지 채우고 획 1.20배·초록 1.12배)을 먹였다.
        favicon.ico는 16·32용으로 더 센 보정(0.90 / 1.45 / 1.25)을 따로 구워 넣었다.
     🪤 ICO 안의 PNG는 RGBA여야 한다 — RGB면 Next가 죽고 전 페이지 500이 난다(실제로 겪음). -->
  <g fill="none" stroke="#111111" stroke-width="6.85">
    <ellipse cx="50.0" cy="50.0" rx="47.81" ry="16.19" transform="rotate(35.25 50.0 50.0)"/>
    <ellipse cx="50.0" cy="50.0" rx="47.81" ry="16.19" transform="rotate(-35.25 50.0 50.0)"/>
  </g>
  <circle cx="50.0" cy="50.0" r="10.80" fill="#98FF5C"/>
</svg>
